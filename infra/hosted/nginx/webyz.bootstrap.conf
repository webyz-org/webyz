# webyz.io, app.webyz.io, api.webyz.io: HTTP only, for issuing the first
# certificates. Install this as conf.d/webyz.conf, run certs.sh, then replace
# it with webyz.conf. Nothing is proxied from here.
server {
    listen 80;
    server_name webyz.io www.webyz.io app.webyz.io api.webyz.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
