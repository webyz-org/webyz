# The hosted Webyz behind the shared nginx-proxy container.
#
#   webyz.io      -> webyz-web:3000   marketing site (Next.js)
#   app.webyz.io  -> webyz-app:8080   dashboard (static, nginx-unprivileged)
#   api.webyz.io  -> webyz-api:3042   API, tracker script, ingest, webhooks
#
# All three containers sit on the shared `proxy` network and are addressed by
# name; the resolver line makes nginx look them up at request time, so nginx
# starts and reloads even while a container is down or being rebuilt.
#
# Cloudflare fronts every hostname. cloudflare-real-ip.conf turns
# CF-Connecting-IP into $remote_addr for requests that come from Cloudflare's
# ranges, so what the API receives in X-Forwarded-For is the visitor, which
# the visitor hash, the geo lookup, rate limits and the Paddle webhook
# allowlist all depend on. The API trusts exactly this one hop (TRUST_PROXY=1).

# One access log line per request with the hostname first. The shared
# nginx.conf's default format has no $host, so a request to app.webyz.io and
# one to api.webyz.io looked the same in the log, which made a payment
# provider's domain check impossible to trace. ssl= shows the protocol and the
# SNI name the client sent; upstream= shows what the container answered.
log_format webyz_host '$host $remote_addr [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" ssl=$ssl_protocol/$ssl_server_name upstream=$upstream_status';

# ── HTTP: certificates and redirects ─────────────────────────────────────────
server {
    listen 80;
    server_name webyz.io www.webyz.io app.webyz.io api.webyz.io;
    access_log /var/log/nginx/access.log webyz_host;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── marketing: webyz.io ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name www.webyz.io;
    access_log /var/log/nginx/access.log webyz_host;

    ssl_certificate /etc/letsencrypt/live/webyz.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webyz.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://webyz.io$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name webyz.io;
    access_log /var/log/nginx/access.log webyz_host;

    ssl_certificate /etc/letsencrypt/live/webyz.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webyz.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/conf.d/cloudflare-real-ip.conf;

    resolver 127.0.0.11 valid=10s;
    set $upstream http://webyz-web:3000;

    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ── dashboard: app.webyz.io ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name app.webyz.io;
    access_log /var/log/nginx/access.log webyz_host;

    ssl_certificate /etc/letsencrypt/live/app.webyz.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.webyz.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/conf.d/cloudflare-real-ip.conf;

    resolver 127.0.0.11 valid=10s;
    set $upstream http://webyz-app:8080;

    # The dashboard is static; the image's own nginx serves it and the API
    # sets security headers on its responses. These are the headers the
    # open-source Caddy adds for the dashboard, kept identical.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The product's public pages live on the marketing host. Someone who types
    # them here (a customer, or a payment provider's reviewer checking what
    # this domain sells) is sent there instead of getting the app shell.
    location ~ ^/(pricing|terms|privacy|refunds|docs)/?$ {
        return 302 https://webyz.io$request_uri;
    }

    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ── API: api.webyz.io ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.webyz.io;
    access_log /var/log/nginx/access.log webyz_host;

    ssl_certificate /etc/letsencrypt/live/api.webyz.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.webyz.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/conf.d/cloudflare-real-ip.conf;

    resolver 127.0.0.11 valid=10s;
    set $upstream http://webyz-api:3042;

    # The API's own limits are far smaller (16 KB tracker bodies); this is a
    # ceiling, not a target.
    client_max_body_size 1m;

    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Ingest is many small requests; buffering only adds latency.
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }
}
