# Serves the dashboard SPA inside its container. The edge nginx on the host
# network proxies to this; TLS and hostnames live there, not here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline headers whatever proxy sits in front. No frame-ancestors rule on
    # purpose: shared dashboards may be embedded.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets never change; index.html must always be fresh so a deploy
    # is picked up on the next load.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Client-side routes: anything that is not a file falls back to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
